# MaixCAM 专用 YOLO11 导出配置。
imgsz: [224, 320]
opset: 17
dynamic: false
simplify: true
input_name: images

# TPU-MLIR 转换前使用的官方 YOLO11 Detect 输出节点。
source_output_names:
  - /model.23/dfl/conv/Conv_output_0
  - /model.23/Sigmoid_output_0

# TPU-MLIR shell 脚本使用的本地输出名称。
output_names:
  - out_box
  - out_cls
